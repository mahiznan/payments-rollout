# PHASE 6: probes + a safe rolling strategy.
# Still NO graceful shutdown, preStop or custom grace period (those are Phase 7).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  labels:
    app: payment-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-api
  # maxUnavailable 0: an old pod is only removed after a new pod is READY
  # (passes its readiness probe). maxSurge 1: at most one extra pod at a time,
  # which is all the memory on CRC allows. (Phase 4 had maxUnavailable: 1.)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
        - name: payment-api
          image: image-registry.openshift-image-registry.svc:5000/my-project/payment-api:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: v1
          resources:
            # CRC has very little schedulable memory left (requests are ~92% allocated),
            # so the REQUEST is small. The LIMIT is what protects the node.
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 512Mi

          # STARTUP: "has the JVM finished booting?"
          # Runs first; liveness and readiness are paused until it succeeds once.
          # Budget: 30 failures x 5s = up to 150s to start, so a slow boot on a busy
          # CRC node is not mistaken for a hung app and restarted.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30

          # LIVENESS: "is the app stuck?" On failure the container is RESTARTED.
          # Only app-internal state (livenessState). A bank outage does not fail this.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # READINESS: "can it take traffic right now?" On failure the pod is
          # REMOVED from the Service endpoints (not restarted). Includes bankGateway.
          # During a rollout a new pod gets no traffic until this passes.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
