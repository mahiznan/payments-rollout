spring:
  application:
    name: payment-api
  lifecycle:
    # How long in-flight requests get to finish after SIGTERM before the app
    # is stopped anyway. Must stay below terminationGracePeriodSeconds minus the
    # preStop sleep (45 - 5 = 40s available, 20s used).
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  # On SIGTERM: readiness flips to OUT_OF_SERVICE, the web server stops taking
  # NEW requests, and requests already running are allowed to finish.
  shutdown: graceful

# Our own settings
app:
  # Echoed in every response so a rollout (v1 -> v2) is visible
  version: ${APP_VERSION:v1}

payments:
  admin:
    # Demo-only bank outage switch, off by default
    enabled: ${ADMIN_ENABLED:false}
  bank:
    # Simulated downstream latency per authorization
    min-latency-ms: 200
    max-latency-ms: 800

management:
  endpoints:
    web:
      exposure:
        # Expose only the health endpoint, nothing else
        include: health
  endpoint:
    health:
      probes:
        # Enables /actuator/health/liveness and /actuator/health/readiness
        # even outside Kubernetes/OpenShift
        enabled: true
      group:
        liveness:
          # App-internal state only. A bank outage must NOT restart pods.
          include: livenessState
        readiness:
          # A pod that cannot reach the bank should not receive traffic.
          include: readinessState,bankGateway
